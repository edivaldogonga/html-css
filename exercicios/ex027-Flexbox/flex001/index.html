<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
      div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-direction: row;
        }

        div.item {
            border: 1px solid black;
            background-color: lightskyblue;
            text-align: center;
            padding: 5px;
           flex: auto;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item"> Exemplo de grupo A</div>
        <div class="item"> Exemplo de grupo B</div>
        <div class="item"> Exemplo de grupo C</div>
        <div class="item"> Exemplo de grupo D</div>
        <div class="item"> Exemplo de grupo E</div>
        <div class="item"> Exemplo de grupo F</div>
        <div class="item"> Exemplo de grupo G</div>
    </div>
</body>
</html>
