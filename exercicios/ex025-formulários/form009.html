<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" autocomplete="on" method="get">

        <p>
            <label for="inum">Número: </label>
            <input type="range" name="num" id="inum" min="0" max="50" oninput="ival.innerHTML= Number(inum.value)" value="25">
            <output name="val" id="ival"></output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Apagar">
        </p>
    </form>
</body>
</html>
