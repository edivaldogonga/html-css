<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formalário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="iest">Estado</label>
            <select name="estado  " id="iest">
                <optgroup label="Paises">
                    <option value="AG">Angola</option>
                    <option value="PT" selected>Portugal</option>
                    <option value="BR">Brazil</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input type="text" id="iprof" name="prof" list="lstprof">

            <datalist id="lstprof">
                <option >Administrador</option>
                <option >Contabilista</option>
                <option >Enginheiro</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagens</label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
